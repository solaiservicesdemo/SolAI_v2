# Redis Configuration for SolAI v2
# Optimized for conversational AI workloads

# Memory and persistence
maxmemory 256mb
maxmemory-policy allkeys-lru
save 300 10
save 60 1000

# Network
bind 127.0.0.1
port 6379
timeout 300

# Logging
loglevel notice
logfile ""

# Performance
tcp-keepalive 300
databases 16
